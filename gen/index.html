<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1E262D">
<title>小石頭邀請函產生器</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
body{background:radial-gradient(120% 70% at 50% 0%,#3A4954 0%,#26313A 55%,#1E262D 100%);min-height:100vh;padding:40px 16px 60px;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto}
.top{text-align:center;color:#F6F1E7}
.top .k{font-family:var(--sc);font-weight:600;font-size:12px;letter-spacing:.46em;padding-left:.46em;color:var(--gold)}
.top h1{font-family:var(--tc);font-weight:600;font-size:clamp(24px,6vw,30px);letter-spacing:.24em;padding-left:.24em;margin:12px 0 6px}
.top p{font-size:14px;color:#A9BAC6;letter-spacing:.08em;margin:0}
.box{background:var(--paper);border-radius:20px;padding:28px 24px;margin-top:26px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.box h2{font-family:var(--tc);font-weight:600;font-size:18px;color:var(--navy);letter-spacing:.12em;text-align:center;margin:0 0 6px}
.box .note{font-size:13.5px;color:var(--mute);text-align:center;line-height:1.8;margin:0 0 18px}
label{display:block;font-size:14px;color:var(--navy);letter-spacing:.12em;margin:16px 0 8px;font-weight:500}
input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px;background:#fff;outline:none;color:var(--ink)}
input:focus{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:15px;color:var(--navy);cursor:pointer;letter-spacing:.08em}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.preview{margin-top:18px;background:var(--sand);border-radius:12px;padding:12px 14px;text-align:center;font-family:var(--tc);font-weight:600;color:var(--navy);letter-spacing:.08em}
.big{width:100%;margin-top:20px;border:0;border-radius:999px;padding:15px;background:linear-gradient(180deg,#F3CC6E,#E3B23C);color:#2B2410;font-family:var(--tc);font-weight:600;font-size:17px;letter-spacing:.24em;cursor:pointer}
.big:disabled{opacity:.5}
.err{color:#B5452F;font-size:14px;text-align:center;min-height:20px;margin-top:10px}
.res{display:none;margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
.res.on{display:block}
.res .who{font-family:var(--tc);font-weight:600;font-size:20px;color:var(--navy);text-align:center;letter-spacing:.1em}
.kv{background:var(--stone);border-radius:12px;padding:12px 14px;margin-top:12px}
.kv .l{font-size:12.5px;color:var(--soft);letter-spacing:.14em}
.kv .v{font-size:15px;color:var(--ink);word-break:break-all;margin-top:4px;line-height:1.6}
.kv .v.pw{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.06em;color:var(--navy)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn2{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:12px;font-size:15px;cursor:pointer;letter-spacing:.08em;text-align:center;text-decoration:none}
.btn2.solid{background:var(--navy);color:#fff}
.tip{font-size:13px;color:var(--mute);line-height:1.8;margin-top:12px;text-align:center}
.hist .item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hist .item:first-of-type{border-top:0}
.hist .n{font-family:var(--tc);font-weight:600;color:var(--navy);font-size:16px}
.hist .m{font-size:12.5px;color:var(--soft);margin-top:2px}
.hist .acts{display:flex;gap:6px}
.hist .acts button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;color:var(--navy);cursor:pointer}
.empty{text-align:center;color:var(--soft);font-size:14px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 20px;font-size:14px;letter-spacing:.1em;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none!important}
</style></head>
<body><div class="wrap">
 <div class="top"><div class="k">Little Stone Dental</div><h1>小石頭邀請函產生器</h1><p>輸入名字，就會產生一封寫著對方名字的信</p></div>

 <div class="box" id="lock">
  <h2>請先輸入管理密碼</h2>
  <p class="note">這個頁面只給籌備處使用。</p>
  <form id="lockf"><input type="password" id="admin" autocomplete="current-password" placeholder="管理密碼" required>
  <button class="big" type="submit">進入</button><div class="err" id="lockerr"></div></form>
 </div>

 <div class="box hidden" id="maker">
  <h2>產生一封新的信</h2>
  <p class="note">適用於顧問、投資人與貴賓。信的最後是小石頭的四項特色，沒有醫師表單。</p>
  <label for="name">對方的名字</label>
  <input type="text" id="name" placeholder="例如：郭子豪" autocomplete="off">
  <label>稱呼</label>
  <div class="chips" id="titles">
   <button type="button" class="on" data-t="顧問">顧問</button><button type="button" data-t="董事長">董事長</button><button type="button" data-t="總經理">總經理</button>
   <button type="button" data-t="醫師">醫師</button><button type="button" data-t="先生">先生</button><button type="button" data-t="女士">女士</button><button type="button" data-t="">不加稱呼</button>
  </div>
  <div class="preview" id="pv">信上會寫：Dear ○○○顧問：</div>
  <button class="big" id="go" type="button" disabled>產生邀請函</button>

  <div class="res" id="res">
   <div class="who" id="rwho"></div>
   <div class="kv"><div class="l">專屬連結</div><div class="v" id="rlink"></div></div>
   <div class="kv"><div class="l">通行密碼</div><div class="v pw" id="rpw"></div></div>
   <div class="row2"><button class="btn2 solid" id="cmsg" type="button">複製整段訊息</button><a class="btn2" id="open" target="_blank" rel="noopener">先打開看看</a></div>
   <div class="row2"><button class="btn2" id="clink" type="button">只複製連結</button><button class="btn2" id="cpw" type="button">只複製密碼</button></div>
   <p class="tip">建議連結和密碼分兩則訊息傳，比較安全。<br>密碼打錯不會鎖住，可以一直重試。</p>
  </div>
 </div>

 <div class="box hidden" id="histbox">
  <h2>已產生的信</h2>
  <p class="note">只記在這台裝置的瀏覽器裡，方便你之後再複製。</p>
  <div class="hist" id="hist"></div>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const ITER = 120000;
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64u = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
let K = null, title = '顧問';
async function kdf(pass, salt, n, use){ const b = await crypto.subtle.importKey('raw', enc.encode(pass.trim()), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:n, hash:'SHA-256'}, b, {name:'AES-GCM', length:256}, false, [use]); }
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 1600); }
async function copy(t, msg){ try { await navigator.clipboard.writeText(t); toast(msg || '已複製'); } catch(e){ prompt('請手動複製：', t); } }
const base = new URL('../', location.href).href;
const WORDS = ['stone','arch','bridge','crown','light','pebble','dawn','keystone'];
function newPw(){ const r = crypto.getRandomValues(new Uint32Array(2)); return WORDS[r[0] % WORDS.length] + '-' + (1000 + r[1] % 9000); }
const salute = () => $('#name').value.trim() + title;
function msg(r){ return `${r.salute}您好：\n\n這是小石頭牙醫診所籌備處寄給您的一封信，請點開下面的連結：\n${r.link}\n\n通行密碼：${r.pw}\n\n（建議開啟聲音觀看）`; }

$('#lockf').addEventListener('submit', async e => {
  e.preventDefault(); $('#lockerr').textContent = '';
  try {
    const a = await (await fetch('../data/admin.json', {cache:'no-store'})).json();
    const key = await kdf($('#admin').value, b64(a.s), a.n, 'decrypt');
    const pt = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(a.i)}, key, b64(a.c))));
    K = pt.k; $('#lock').classList.add('hidden'); $('#maker').classList.remove('hidden'); $('#histbox').classList.remove('hidden'); renderHist(); $('#name').focus();
  } catch(err){ $('#lockerr').textContent = '管理密碼不正確'; }
});
const upd = () => { const n = $('#name').value.trim(); $('#pv').textContent = '信上會寫：Dear ' + (n || '○○○') + title + '：'; $('#go').disabled = !n; };
$('#name').addEventListener('input', upd);
document.querySelectorAll('#titles button').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('#titles button').forEach(x => x.classList.remove('on')); b.classList.add('on'); title = b.dataset.t; upd(); }));

let last = null;
$('#go').addEventListener('click', async () => {
  const name = $('#name').value.trim(); if (!name || !K) return;
  const pw = newPw(), salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await kdf(pw, salt, ITER, 'encrypt');
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify({n:salute(), s:name, k:K}))));
  const tok = new Uint8Array(salt.length + iv.length + ct.length); tok.set(salt); tok.set(iv, 16); tok.set(ct, 28);
  const r = {salute:salute(), name, pw, link: base + '#g=' + tob64u(tok), at: new Date().toLocaleDateString('zh-TW')};
  last = r; show(r); save(r); toast('已產生');
});
function show(r){ $('#rwho').textContent = 'Dear ' + r.salute; $('#rlink').textContent = r.link; $('#rpw').textContent = r.pw; $('#open').href = r.link; $('#res').classList.add('on'); }
$('#cmsg').addEventListener('click', () => last && copy(msg(last), '已複製整段訊息'));
$('#clink').addEventListener('click', () => last && copy(last.link, '已複製連結'));
$('#cpw').addEventListener('click', () => last && copy(last.pw, '已複製密碼'));

const HK = 'ls-gen-history';
const load = () => { try { return JSON.parse(localStorage.getItem(HK) || '[]'); } catch(e){ return []; } };
function save(r){ const h = load(); h.unshift(r); try { localStorage.setItem(HK, JSON.stringify(h.slice(0, 200))); } catch(e){} renderHist(); }
function renderHist(){
  const h = load(), el = $('#hist'); el.innerHTML = '';
  if (!h.length){ el.innerHTML = '<div class="empty">還沒有產生過</div>'; return; }
  h.forEach((r, i) => { const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<div><div class="n"></div><div class="m"></div></div><div class="acts"><button data-a="m">複製訊息</button><button data-a="d">刪除</button></div>`;
    d.querySelector('.n').textContent = r.salute; d.querySelector('.m').textContent = r.at + '・密碼 ' + r.pw;
    d.querySelector('[data-a=m]').onclick = () => copy(msg(r), '已複製整段訊息');
    d.querySelector('[data-a=d]').onclick = () => { if (!confirm('從清單刪除「' + r.salute + '」？（已寄出的連結仍然有效）')) return; const x = load(); x.splice(i, 1); try { localStorage.setItem(HK, JSON.stringify(x)); } catch(e){} renderHist(); };
    el.appendChild(d); });
}
})();
</script>
</body></html>
